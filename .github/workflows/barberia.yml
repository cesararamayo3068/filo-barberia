name: Filo Java + Angular
on:
  push:
    paths: ['backend/**', 'frontend/**', 'compose*.yaml', '.github/workflows/barberia.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'compose*.yaml', '.github/workflows/barberia.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Crear configuración efímera
        run: |
          umask 077
          {
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "COOKIE_SECURE=false"
          } > .env
      - name: Construir y levantar entorno aislado
        run: docker compose -p filo-barberia-test -f compose.yaml -f compose.test.yaml up --build -d --wait --wait-timeout 180
      - name: Probar API, persistencia y concurrencia
        run: mvn -B -ntp -f backend/pom.xml -Phttp-integration verify
      - name: Logs si hay errores
        if: failure()
        run: docker compose -p filo-barberia-test -f compose.yaml -f compose.test.yaml logs --tail 100
      - name: Detener entorno
        if: always()
        run: docker compose -p filo-barberia-test -f compose.yaml -f compose.test.yaml stop
