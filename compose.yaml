name: filo-barberia
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filo
      POSTGRES_USER: filo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55435}:5432"
    volumes:
      - filo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U filo -d filo"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/filo
      DB_USER: filo
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18083}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD","wget","-q","--spider","http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-14203}:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  filo_data:
